name: Lint OpenAPI spec on Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.oas.yaml'
      - '**.oas.yml'
      - '**.oas.json'
jobs:
  lint:
    permissions:
      checks: write
    name: Lint OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run Spectral
        uses: stoplightio/spectral-action@v0.8.11
        with:
          file_glob: '*.oas.{json,yml,yaml}'
